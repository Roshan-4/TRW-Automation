name: Truck Junction Automation Test Workflow

on:
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '30 21 * * *' # 21:30 UTC = 03:00 AM IST
  workflow_dispatch: {}

env:
  NODE_VERSION: '24'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache dependencies and Cypress binary
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  cypress-run:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        suite: [ui, seo]
        device: [desktop, mobile]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cached dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run Cypress tests (Chrome - ${{ matrix.suite }} - ${{ matrix.device }})
        run: npm run cypress:run:${{ matrix.suite }}:${{ matrix.device }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-${{ matrix.suite }}-${{ matrix.device }}
          path: cypress/screenshots

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos-${{ matrix.suite }}-${{ matrix.device }}
          path: cypress/videos

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.suite }}-${{ matrix.device }}
          path: allure-results

      - name: Upload SEO structure Excel report
        uses: actions/upload-artifact@v4
        if: always() && matrix.suite == 'seo'
        with:
          name: seo-structure-report-${{ matrix.device }}
          path: artifacts/seo-structure-report.xlsx
          if-no-files-found: ignore

  # Nightly (03:00 IST) and manual workflow_dispatch only — not on PRs.
  # Log-only sitemap URL health: cy.request on each <loc> inside the 8 XMLs.
  # Runs in parallel with ui/seo. continue-on-error so a timeout here does
  # not block the combined Allure report from ui/seo.
  sitemap-run:
    runs-on: ubuntu-latest
    needs: setup
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 360
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cached dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run sitemap HTTPS URL health (log only)
        run: npm run test:sitemap

      - name: Upload sitemap Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-sitemap
          path: allure-results
          if-no-files-found: ignore

  publish-report:
    runs-on: ubuntu-latest
    needs: [setup, cypress-run, sitemap-run]
    if: >-
      always() && !cancelled() && needs.setup.result == 'success' &&
      (needs.sitemap-run.result == 'success' || needs.sitemap-run.result == 'skipped' || needs.sitemap-run.result == 'failure')
    env:
      REPORTS_DEPLOY_TOKEN: ${{ secrets.REPORTS_DEPLOY_TOKEN }}
      REPORT_EMAIL_API_KEY: ${{ secrets.REPORT_EMAIL_API_KEY }}
      REPORT_EMAIL_RECIPIENTS: ${{ vars.REPORT_EMAIL_RECIPIENTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cached dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download UI desktop Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ui-desktop
          path: allure-results

      - name: Download UI mobile Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ui-mobile
          path: allure-results

      - name: Download SEO desktop Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-seo-desktop
          path: allure-results

      - name: Download SEO mobile Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-seo-mobile
          path: allure-results

      - name: Download sitemap Allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-sitemap
          path: allure-results

      - name: Download UI desktop failure screenshots
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: screenshots-ui-desktop
          path: cypress/screenshots-ui-desktop

      - name: Download UI mobile failure screenshots
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: screenshots-ui-mobile
          path: cypress/screenshots-ui-mobile

      - name: Download SEO desktop failure screenshots
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: screenshots-seo-desktop
          path: cypress/screenshots-seo-desktop

      - name: Download SEO mobile failure screenshots
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: screenshots-seo-mobile
          path: cypress/screenshots-seo-mobile

      - name: Download SEO structure Excel reports (desktop + mobile)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: seo-structure-report-*
          path: artifacts/seo-structure-per-device
          merge-multiple: false

      - name: Merge SEO structure Excel reports into one file
        run: |
          shopt -s nullglob
          sources=(artifacts/seo-structure-per-device/*/seo-structure-report.xlsx)
          if [ ${#sources[@]} -eq 0 ]; then
            echo "No per-device SEO structure Excel reports found — skipping merge."
          else
            node scripts/merge-seo-structure-excel.js artifacts/seo-structure-report.xlsx "${sources[@]}"
          fi

      - name: Upload merged SEO structure Excel report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-structure-report
          path: artifacts/seo-structure-report.xlsx
          if-no-files-found: ignore

      - name: Generate Allure HTML report
        if: always()
        run: npm run generate:report

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-report
          path: allure-report

      - name: Publish report to GitHub Pages history
        if: ${{ always() && env.REPORTS_DEPLOY_TOKEN != '' }}
        run: npm run report:publish

      - name: Send report email
        if: ${{ always() && env.REPORT_EMAIL_API_KEY != '' }}
        run: npm run report:email
