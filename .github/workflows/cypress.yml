name: Cypress Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch: {}

env:
  NODE_VERSION: '24'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache dependencies and Cypress binary
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  cypress-run:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cached dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run Cypress tests (Chrome - ${{ matrix.device }})
        run: npm run cypress:run:${{ matrix.device }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-${{ matrix.device }}
          path: cypress/screenshots

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos-${{ matrix.device }}
          path: cypress/videos

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.device }}
          path: allure-results

  publish-report:
    runs-on: ubuntu-latest
    needs: [setup, cypress-run]
    if: always()
    env:
      REPORTS_DEPLOY_TOKEN: ${{ secrets.REPORTS_DEPLOY_TOKEN }}
      REPORT_EMAIL_API_KEY: ${{ secrets.REPORT_EMAIL_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cached dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download desktop Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-desktop
          path: allure-results

      - name: Download mobile Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-mobile
          path: allure-results

      - name: Download desktop failure screenshots
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: screenshots-desktop
          path: cypress/screenshots-desktop

      - name: Download mobile failure screenshots
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: screenshots-mobile
          path: cypress/screenshots-mobile

      - name: Generate Allure HTML report
        if: always()
        run: npm run generate:report

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-report
          path: allure-report

      - name: Publish report to GitHub Pages history
        if: ${{ always() && env.REPORTS_DEPLOY_TOKEN != '' }}
        run: npm run report:publish

      - name: Send report email
        if: ${{ always() && env.REPORT_EMAIL_API_KEY != '' }}
        run: npm run report:email
