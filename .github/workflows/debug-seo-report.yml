name: DEBUG - SEO Report Pipeline

# Throwaway workflow to validate the new artifact-upload/merge/publish/email
# plumbing added to cypress.yml without waiting on the full multi-hour
# suite. Runs exactly one tiny SEO spec on desktop + mobile, then exercises
# the same merge -> publish -> email steps as the real pipeline. Delete this
# file once the wiring is confirmed working.

on:
  workflow_dispatch: {}

env:
  NODE_VERSION: '24'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache dependencies and Cypress binary
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  seo-run:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cached dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run one small SEO spec (Chrome - ${{ matrix.device }})
        run: npx cross-env DEVICE=${{ matrix.device }} cypress run --browser chrome --spec "cypress/e2e/seo/Brochure/SeoStructure.cy.js" --expose grepTags=@en,grepOmitFiltered=true

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.device }}
          path: allure-results

      - name: Upload SEO structure Excel report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-structure-report-${{ matrix.device }}
          path: artifacts/seo-structure-report.xlsx
          if-no-files-found: ignore

  publish-report:
    runs-on: ubuntu-latest
    needs: [setup, seo-run]
    if: always()
    env:
      REPORTS_DEPLOY_TOKEN: ${{ secrets.REPORTS_DEPLOY_TOKEN }}
      REPORT_EMAIL_API_KEY: ${{ secrets.REPORT_EMAIL_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cached dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download desktop Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-desktop
          path: allure-results

      - name: Download mobile Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-mobile
          path: allure-results

      - name: Download SEO structure Excel reports (desktop + mobile)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: seo-structure-report-*
          path: artifacts/seo-structure-per-device

      - name: Merge SEO structure Excel reports into one file
        run: |
          shopt -s nullglob
          sources=(artifacts/seo-structure-per-device/*/seo-structure-report.xlsx)
          if [ ${#sources[@]} -eq 0 ]; then
            echo "No per-device SEO structure Excel reports found — skipping merge."
          else
            node scripts/merge-seo-structure-excel.js artifacts/seo-structure-report.xlsx "${sources[@]}"
          fi

      - name: Upload merged SEO structure Excel report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-structure-report
          path: artifacts/seo-structure-report.xlsx
          if-no-files-found: ignore

      - name: Generate Allure HTML report
        run: npm run generate:report

      - name: Publish report to GitHub Pages history
        if: ${{ env.REPORTS_DEPLOY_TOKEN != '' }}
        run: npm run report:publish

      - name: Send report email
        if: ${{ env.REPORT_EMAIL_API_KEY != '' }}
        run: npm run report:email
